<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampRent - Riwayat Booking</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/user.css"
    >

</head>


<body>


<nav class="navbar">

    <div class="navbar-logo">

        <h2>CampRent</h2>

    </div>


    <div class="navbar-menu">

        <a href="index.html">
            Home
        </a>

        <a href="booking.html">
            Booking
        </a>

        <a
            href="history.html"
            class="active"
        >
            Riwayat
        </a>

        <button
            onclick="logout()"
            class="btn-logout"
        >
            Logout
        </button>

    </div>

</nav>



<main class="user-container">

    <section>

        <h1>
            Riwayat Booking
        </h1>

        <p style="color:#777; margin:10px 0 30px;">
            Daftar booking yang pernah kamu buat.
        </p>


        <div id="historyList">

        </div>

    </section>

</main>



<script src="../js/data.js"></script>

<script src="../js/user.js"></script>


<script>

function displayHistory() {

    const historyList =
        document.getElementById(
            "historyList"
        );


    const bookings =
        JSON.parse(
            localStorage.getItem(
                "camprent_bookings"
            )
        ) || [];


    const myBookings =
        bookings.filter(
            function(item) {

                return (
                    item.userId ===
                    currentUser.id
                );

            }
        );


    if (myBookings.length === 0) {

        historyList.innerHTML = `

            <div class="package-card">

                <div class="package-content">

                    <h3>
                        Belum Ada Booking
                    </h3>

                    <p class="package-description">

                        Kamu belum memiliki
                        riwayat booking.

                    </p>

                    <br>

                    <a
                        href="index.html"
                        class="btn-book"
                        style="
                            display:block;
                            text-align:center;
                            text-decoration:none;
                        "
                    >
                        Cari Paket Camping
                    </a>

                </div>

            </div>

        `;

        return;

    }


    historyList.innerHTML = "";


    myBookings
        .slice()
        .reverse()
        .forEach(
            function(item) {

                const bookingDateRange =
                    item.bookingDateStart && item.bookingDateEnd
                        ? item.bookingDateStart + " sampai " + item.bookingDateEnd
                        : item.bookingDate;

                const card = document.createElement("article");
                card.className = "transaction-history-card";

                const header = document.createElement("div");
                header.className = "transaction-history-header";

                const titleGroup = document.createElement("div");
                const title = document.createElement("h2");
                title.textContent = item.packageName;
                const code = document.createElement("span");
                code.className = "transaction-history-code";
                code.textContent = `Kode booking: ${item.bookingCode}`;
                titleGroup.append(title, code);

                const statuses = document.createElement("div");
                statuses.className = "transaction-history-statuses";
                const bookingStatus = document.createElement("span");
                bookingStatus.className = "history-status-badge";
                bookingStatus.textContent = `Booking: ${item.status}`;
                const paymentStatus = document.createElement("span");
                paymentStatus.className = "history-status-badge payment";
                paymentStatus.textContent = `Pembayaran: ${item.paymentStatus || "Belum ada data"}`;
                if (item.paymentStatus === "Lunas") {
                    paymentStatus.classList.add("is-paid");
                }
                statuses.append(bookingStatus, paymentStatus);
                header.append(titleGroup, statuses);

                const details = document.createElement("div");
                details.className = "transaction-history-details";
                [
                    ["Tanggal kegiatan", bookingDateRange],
                    ["Durasi", `${item.duration} ${item.durationUnit || "malam"}`],
                    ["BBQ", item.bbq || "Tidak ada"],
                    ["Metode pembayaran", item.paymentMethod || "Belum dipilih"]
                ].forEach(([label, value]) => {
                    const detail = document.createElement("div");
                    const detailLabel = document.createElement("span");
                    detailLabel.textContent = label;
                    const detailValue = document.createElement("strong");
                    detailValue.textContent = value;
                    detail.append(detailLabel, detailValue);
                    details.appendChild(detail);
                });

                const costs = document.createElement("div");
                costs.className = "transaction-history-costs";
                [
                    ["Harga paket", item.campPrice],
                    ["BBQ", item.bbqPrice]
                ].forEach(([label, amount]) => {
                    const row = document.createElement("div");
                    const rowLabel = document.createElement("span");
                    rowLabel.textContent = label;
                    const rowAmount = document.createElement("strong");
                    rowAmount.textContent = formatRupiah(Number(amount) || 0);
                    row.append(rowLabel, rowAmount);
                    costs.appendChild(row);
                });

                const total = document.createElement("div");
                total.className = "transaction-history-total";
                const totalLabel = document.createElement("span");
                totalLabel.textContent = "Total transaksi";
                const totalAmount = document.createElement("strong");
                totalAmount.textContent = formatRupiah(item.total);
                total.append(totalLabel, totalAmount);
                costs.appendChild(total);

                card.append(header, details, costs);
                historyList.appendChild(card);
            }
        );

}


displayHistory();

</script>


</body>

</html>
